[package]
name = "renzora_engine_plugins"
version = "0.1.0"
edition = "2021"
description = "Portable build and staging service for restart-required Renzora engine plugins."

[dependencies]
bevy = { workspace = true }
blake3 = "1"
renzora = { path = "../renzora", default-features = false }
renzora_compiler_cache = { path = "../renzora_compiler_cache" }
renzora_identity = { path = "../renzora_identity" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
