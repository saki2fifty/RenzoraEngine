# The project's Rust scripts, compiled into the binary.
#
# This checked-in copy is EMPTY and deliberately so — see `src/lib.rs`. The lean
# exporter rewrites both this manifest and that file inside its throwaway copy of
# the workspace (`target/export-src/`), adding one `#[path]` module per script in
# the project's `scripts/` directory. The dev tree is never touched.
#
# Phase 4: scripts target the versioned Tier 1 C-ABI in `renzora_plugin`. The
# generated aggregator collects each module's `__tier1_entry` as a
# `CompiledScript` typed function pointer.
[package]
name = "renzora_static_scripts"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora_plugin = { path = "../renzora_plugin", default-features = false, features = ["script"] }
renzora_identity = { path = "../renzora_identity" }

[dev-dependencies]
# Test under tests/ builds a synthetic generator output and parses it.
tempfile = "3"

[lints]
workspace = true
