[package]
name = "renzora_loose_plugins"
version = "0.1.0"
edition = "2021"
description = "Phase 3 Tier-1 single-file hot Rust plugins: discovery, compilation through the cached compiler service, transactional activation, and Settings integration."

[features]
default = []

[dependencies]
bevy = { workspace = true }
renzora_identity = { path = "../renzora_identity", features = ["std"] }
renzora_compiler_cache = { path = "../renzora_compiler_cache" }
renzora_plugin = { path = "../renzora_plugin", features = ["host"] }
renzora = { path = "../renzora", default-features = false }
renzora_bsn = { path = "../renzora_bsn" }
renzora_engine = { path = "../renzora_engine" }
parking_lot = "0.12"
crossbeam-channel = "0.5"
notify-debouncer-full = "0.7"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
blake3 = "1"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
toml = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
