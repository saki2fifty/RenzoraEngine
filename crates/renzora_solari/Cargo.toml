[package]
name = "renzora_solari"
version = "0.1.0"
edition = "2021"
description = "Solari hardware-raytraced global illumination, statically linked and gated on GPU ray-tracing support"

# Engine feature, linked by the runtime's Solari feature. Shared authored
# settings and GPU capability types live in the renzora contract crate.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# Compiles the Solari inspector entry.
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora" }

[lints]
workspace = true
