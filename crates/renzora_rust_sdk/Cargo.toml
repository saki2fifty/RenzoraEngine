[package]
name = "renzora_rust_sdk"
version = "0.1.0"
edition = "2021"
description = "Bevy-independent Rust source SDK layout and release packaging"

[features]
default = []
packaging = ["dep:toml", "dep:thiserror"]

[dependencies]
toml = { version = "0.8", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
