[package]
name = "renzora_editor"
version = "0.1.0"
edition = "2021"

# Editor-only plugins, statically linked into `renzora-editor`. The runtime
# package does not depend on this crate, so exported games omit editor code.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# Pull editor tooling and the editor contract features it needs.
editor = [
    # Editor-only crates (foundation + panels)
    "dep:renzora_undo",
    "dep:renzora_editor_framework",
    "dep:renzora_splash",
    "dep:renzora_asset_registry",
    "dep:renzora_viewport",
    "dep:renzora_camera",
    "dep:renzora_gizmo",
    "dep:renzora_grid",
    "dep:renzora_scene",
    "dep:renzora_keybindings",
    "dep:renzora_console",
    "dep:renzora_shell",
    "dep:renzora_animation_editor",
    "dep:renzora_asset_browser",
    "dep:renzora_autosave",
    "dep:renzora_blueprint_editor",
    "dep:renzora_code_editor",
    "dep:renzora_command_palette",
    "dep:renzora_context_menu",
    "dep:renzora_debugger",
    "dep:renzora_export",
    "dep:renzora_foliage_editor",
    "dep:renzora_hierarchy",
    "dep:renzora_history",
    "dep:renzora_import_ui",
    "dep:renzora_inspector",
    "dep:renzora_level_presets",
    "dep:renzora_marketplace",
    "dep:renzora_material_editor",
    "dep:renzora_mesh_edit",
    "dep:renzora_mixer",
    "dep:renzora_network_editor",
    "dep:renzora_particle_editor",
    "dep:renzora_settings",
    "dep:renzora_shader_editor",
    "dep:renzora_shape_library",
    "dep:renzora_system_monitor",
    "dep:renzora_terrain_editor",
    "dep:renzora_tilemap_editor",
    "dep:renzora_sprite_anim_editor",
    "dep:renzora_test_component",
    "dep:renzora_theme_status",
    "dep:renzora_tutorial",
    # NOTE: no `renzora_tracy`. The Tracy bridge is `plugins/tracy`, a standalone
    # C-ABI cdylib — it reads the diagnostic store across the boundary
    # (`SystemCall::diagnostics`, ABI MINOR 4.8) rather than linking Bevy, so the
    # editor no longer compiles `tracy-client`'s C sources to ship a profiler
    # most builds never arm. Delete the dll and the feature is gone.
    # Cascade editor sub-features into the dual-mode crates (these arrive as
    # rlibs; this flips on their `editor` code so the panels compile here).
    # renzora_engine is fully split: its editor half is a separate dep crate.
    "dep:renzora_engine_editor",
    "dep:renzora_physics_editor",
    "dep:renzora_scripting_editor",
    "dep:renzora_lighting_editor",
    "dep:renzora_tonemapping_editor",
    "dep:renzora_bloom_effect_editor",
    "dep:renzora_dof_editor",
    "dep:renzora_motion_blur_editor",
    "dep:renzora_antialiasing_editor",
    "dep:renzora_distance_fog_editor",
    "dep:renzora_volumetric_fog_editor",
    "dep:renzora_atmosphere_editor",
    "dep:renzora_environment_map_editor",
    "dep:renzora_ssao_editor",
    "dep:renzora_ssr_editor",
    "dep:renzora_lens_distortion_editor",
    "dep:renzora_oit_editor",
    "dep:renzora_skybox_editor",
    "dep:renzora_forward_decal_editor",
    "renzora_network/editor",
    "dep:renzora_water_editor",
    "dep:renzora_ember_editor",
    "dep:renzora_navmesh_editor",
]

[dependencies]
renzora = { path = "../renzora", default-features = false }


# ── Editor-only crates (the `dep:` entries flipped on by `editor`) ───────────
renzora_undo               = { path = "../renzora_undo", optional = true }
renzora_editor_framework             = { path = "../renzora_editor_framework", optional = true }
renzora_splash             = { path = "../renzora_splash", optional = true }
renzora_asset_registry     = { path = "../renzora_asset_registry", optional = true }
renzora_viewport           = { path = "../renzora_viewport", optional = true }
renzora_camera             = { path = "../renzora_camera", optional = true }
renzora_gizmo              = { path = "../renzora_gizmo", optional = true }
renzora_grid               = { path = "../renzora_grid", optional = true }
renzora_scene              = { path = "../renzora_scene", optional = true }
renzora_keybindings        = { path = "../renzora_keybindings", optional = true }
renzora_console            = { path = "../renzora_console", optional = true }
renzora_shell              = { path = "../renzora_shell", optional = true }
renzora_animation_editor   = { path = "../renzora_animation_editor", optional = true }
renzora_asset_browser      = { path = "../renzora_asset_browser", optional = true }
renzora_autosave           = { path = "../renzora_autosave", optional = true }
renzora_blueprint_editor   = { path = "../renzora_blueprint_editor", optional = true }
renzora_code_editor        = { path = "../renzora_code_editor", optional = true }
renzora_command_palette    = { path = "../renzora_command_palette", optional = true }
renzora_context_menu       = { path = "../renzora_context_menu", optional = true }
renzora_debugger           = { path = "../renzora_debugger", optional = true }
renzora_export             = { path = "../renzora_export", optional = true }
renzora_foliage_editor     = { path = "../renzora_foliage_editor", optional = true }
renzora_hierarchy          = { path = "../renzora_hierarchy", optional = true }
renzora_history            = { path = "../renzora_history", optional = true }
renzora_import_ui          = { path = "../renzora_import_ui", optional = true }
renzora_inspector          = { path = "../renzora_inspector", optional = true }
renzora_level_presets      = { path = "../renzora_level_presets", optional = true }
renzora_marketplace        = { path = "../renzora_marketplace", optional = true }
renzora_material_editor    = { path = "../renzora_material_editor", optional = true }
renzora_mesh_edit          = { path = "../renzora_mesh_edit", optional = true }
renzora_mixer              = { path = "../renzora_mixer", optional = true }
renzora_network_editor     = { path = "../renzora_network_editor", optional = true }
renzora_particle_editor    = { path = "../renzora_particle_editor", optional = true }
renzora_settings           = { path = "../renzora_settings", optional = true }
renzora_shader_editor      = { path = "../renzora_shader_editor", optional = true }
renzora_shape_library      = { path = "../renzora_shape_library", optional = true }
renzora_system_monitor     = { path = "../renzora_system_monitor", optional = true }
renzora_terrain_editor     = { path = "../renzora_terrain_editor", optional = true }
renzora_tilemap_editor     = { path = "../renzora_tilemap/editor", optional = true }
renzora_sprite_anim_editor = { path = "../renzora_sprite_anim/editor", optional = true }
renzora_test_component     = { path = "../renzora_test_component", optional = true }
renzora_theme_status       = { path = "../renzora_theme_status", optional = true }
renzora_tutorial           = { path = "../renzora_tutorial", optional = true }
renzora_engine_editor      = { path = "../renzora_engine/editor", optional = true }

# ── Dual-mode crates touched by the `editor` cascade above ───────────────────
# Non-optional: they arrive transitively anyway; listing them directly makes
# the `renzora_x/editor` feature refs in `[features].editor` resolvable and
# lets the keepalive cover them. They re-link as rlibs (accepted bloat from
# decision (a)); they install nothing extra at runtime (Editor-scope filter).
# Dual-mode crates NOT referenced by any `/editor` cascade (renzora_input,
# renzora_blueprint, renzora_spline, renzora_audio,
# renzora_shader, renzora_postprocess) are omitted — they arrive transitively
# and hold no Editor-scope plugins for the bundle to install.
renzora_engine          = { path = "../renzora_engine" }
# Both backends: a project can hold 3D and 2D scenes, so the editor never
# strips either. Explicit because renzora_physics has no default backend — the
# choice belongs to whoever is shipping.
renzora_physics         = { path = "../renzora_physics", features = ["avian3d", "avian2d"] }
renzora_physics_editor  = { path = "../renzora_physics/editor", optional = true }
renzora_scripting       = { path = "../renzora_scripting" }
renzora_scripting_editor = { path = "../renzora_scripting/editor", optional = true }
renzora_lighting        = { path = "../renzora_lighting" }
renzora_lighting_editor = { path = "../renzora_lighting/editor", optional = true }
renzora_hanabi          = { path = "../renzora_hanabi" }
renzora_tonemapping     = { path = "../renzora_tonemapping" }
renzora_tonemapping_editor = { path = "../renzora_tonemapping/editor", optional = true }
renzora_bloom_effect    = { path = "../renzora_bloom_effect" }
renzora_bloom_effect_editor = { path = "../renzora_bloom_effect/editor", optional = true }
renzora_dof             = { path = "../renzora_dof" }
renzora_dof_editor      = { path = "../renzora_dof/editor", optional = true }
renzora_motion_blur     = { path = "../renzora_motion_blur" }
renzora_motion_blur_editor = { path = "../renzora_motion_blur/editor", optional = true }
renzora_antialiasing    = { path = "../renzora_antialiasing" }
renzora_antialiasing_editor = { path = "../renzora_antialiasing/editor", optional = true }
renzora_distance_fog    = { path = "../renzora_distance_fog" }
renzora_distance_fog_editor = { path = "../renzora_distance_fog/editor", optional = true }
renzora_volumetric_fog  = { path = "../renzora_volumetric_fog" }
renzora_volumetric_fog_editor = { path = "../renzora_volumetric_fog/editor", optional = true }
renzora_atmosphere      = { path = "../renzora_atmosphere" }
renzora_atmosphere_editor = { path = "../renzora_atmosphere/editor", optional = true }
renzora_environment_map = { path = "../renzora_environment_map" }
renzora_environment_map_editor = { path = "../renzora_environment_map/editor", optional = true }
renzora_ssao            = { path = "../renzora_ssao" }
renzora_ssao_editor     = { path = "../renzora_ssao/editor", optional = true }
renzora_ssr             = { path = "../renzora_ssr" }
renzora_ssr_editor      = { path = "../renzora_ssr/editor", optional = true }
renzora_lens_distortion = { path = "../renzora_lens_distortion" }
renzora_lens_distortion_editor = { path = "../renzora_lens_distortion/editor", optional = true }
renzora_oit             = { path = "../renzora_oit" }
renzora_oit_editor      = { path = "../renzora_oit/editor", optional = true }
renzora_skybox          = { path = "../renzora_skybox" }
renzora_skybox_editor   = { path = "../renzora_skybox/editor", optional = true }
# Procedural tree is a NATIVE plugin (`plugins/procedural_tree/`) — generator,
# runtime glue and editor integration all live there, so neither half is linked.
renzora_forward_decal_editor = { path = "../renzora_forward_decal/editor", optional = true }
renzora_network         = { path = "../renzora_network" }
renzora_animation       = { path = "../renzora_animation" }
renzora_water           = { path = "../renzora_water" }
renzora_water_editor    = { path = "../renzora_water/editor", optional = true }
renzora_terrain         = { path = "../renzora_terrain" }
renzora_ember_editor    = { path = "../renzora_ember/editor", optional = true }
renzora_navmesh         = { path = "../renzora_navmesh" }
renzora_navmesh_editor  = { path = "../renzora_navmesh/editor", optional = true }

# ── generated by `cargo renzora sync` — declared plugin crates ──
# Discovered from their `renzora::add!` lines. Plain, non-optional
# entries: a new plugin is always compiled and always installed. To let
# the lean exporter strip one, move its line out of this block, mark it
# `optional = true`, and put it in a feature — the generator will leave
# it alone and read the gate back from there.
#
# Delete a plugin with `cargo renzora remove <crate>`, not by hand: an
# entry here pointing at a directory that no longer exists stops cargo
# loading the workspace, including to run the generator that would fix
# it. If you hit that, delete the offending line below.
renzora_ai_chat_editor = { path = "../renzora_ai_chat_editor" }
renzora_auto_exposure_editor = { path = "../renzora_auto_exposure_editor" }
renzora_clouds_editor = { path = "../renzora_clouds_editor" }
renzora_engine_plugins = { path = "../renzora_engine_plugins" }
renzora_gamepad_editor = { path = "../renzora_gamepad_editor" }
renzora_mesh_draw_editor = { path = "../renzora_mesh_draw_editor" }
renzora_night_stars_editor = { path = "../renzora_night_stars_editor" }
renzora_parkour_editor = { path = "../renzora_parkour/editor" }
renzora_pool_water_editor = { path = "../renzora_pool_water_editor" }
renzora_procedural_tree_editor = { path = "../renzora_procedural_tree_editor" }
renzora_text3d_editor = { path = "../renzora_text3d_editor" }
renzora_update = { path = "../renzora_update" }
renzora_vignette_editor = { path = "../renzora_vignette_editor" }
renzora_wind_editor = { path = "../renzora_wind/editor" }
# ── end generated ──

[lints]
workspace = true
