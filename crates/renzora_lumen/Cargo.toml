[package]
name = "renzora_lumen"
version = "0.1.0"
edition = "2021"
description = "Statically linked Lumen-inspired global illumination with the renzora_rt ScreenSpace backend."

# Generated runtime wiring installs this engine plugin once. Shared GI settings
# live in the `renzora` contract; consumers need not depend on this implementation.
[lib]
crate-type = ["rlib"]

[features]
default = ["editor"]
# Compiles the Lumen + RT inspectors and the debugger diagnostics producer.
editor = ["renzora/editor"]

[dependencies]
bevy = { workspace = true }
renzora = { path = "../renzora" }
# Lumen's ScreenSpace backend, linked as a library.
renzora_rt = { path = "../renzora_rt" }
renzora_shader = { path = "../renzora_shader" }
serde = { version = "1.0", features = ["derive"] }
bytemuck = { version = "1.5", features = ["derive"] }

[lints]
workspace = true
