[package]
name = "renzora_cloth"
version = "0.1.0"
edition = "2021"
description = "Statically linked cloth physics plugin wrapping the vendored bevy_silk engine."

# Engine plugin installed through generated runtime wiring.
[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]
bevy = { workspace = true }
# The vendored verlet cloth engine this plugin exposes to the runtime.
bevy_silk = { path = "../bevy_silk" }
renzora = { path = "../renzora", default-features = false }

[lints]
workspace = true
