name: Fork documentation archive

# Documentation belongs to this repository. Never check out or push another
# repository, and never require a website's publishing credentials.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/sync-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == 'saki2fifty/RenzoraEngine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive repository documentation
        uses: actions/upload-artifact@v4
        with:
          name: fork-documentation
          path: docs/
          if-no-files-found: error
          retention-days: 30
