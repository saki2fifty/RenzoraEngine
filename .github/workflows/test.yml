name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The GitHub runner gives us ~20 GB of usable disk. The full Bevy workspace's
# `dev`/`test` target dir carries enormous debuginfo, and once `rust-cache`
# restores a populated target dir and we build on top of it the two together
# overflow the disk ("No space left on device"). CI never debugs, and tests
# pass/fail identically without line tables, so drop debuginfo and incremental
# artifacts workspace-wide. Use one non-dev profile and a new cache namespace
# so migrating profiles cannot restore a second, obsolete artifact tree.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DIST_DEBUG: "0"
  CARGO_TERM_COLOR: always

# Native checks bootstrap their pinned toolchain independently of publishing.
# They never pull an official-project image or wait for a fork image release.
permissions:
  contents: read

jobs:
  # The plugin wiring (`renzora_runtime`/`renzora_editor`'s `plugins.rs` and
  # their generated dependency blocks) is generated from the `renzora::add!`
  # declarations under `crates/`, and committed so a plain `cargo build` works.
  # Committed generated files can go stale, and a stale plugin list fails
  # SILENTLY — the plugin simply never installs. This job is what makes that
  # impossible: it regenerates and fails if anything differs from what was
  # committed. Runs on the plain image (a source scan, no compile of the engine).
  sync:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci

      - name: Check fork automation boundaries
        run: |
          python3 scripts/test_fork_workflow_policy.py
          python3 scripts/test_release_tool_verification.py
          python3 scripts/test_release_packaging.py
          python3 -B scripts/test_compress_runtime.py

      - name: Check plugin wiring is regenerated
        run: cargo run --profile release --manifest-path xtask/Cargo.toml -- sync --check

  test:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci

      # Do not restore the prior dev/test profile cache into dist builds.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-dist

      # Tests the engine's own crates only. The vendored Bevy-ecosystem crates
      # (bevy_*, vleue_navigator) are third-party code copied into the tree;
      # running their suites just re-tests upstream against our Bevy version and
      # breaks on every API drift — noise, not signal. They're still built as
      # dependencies; we just don't run their tests. New first-party crates stay
      # covered automatically via --workspace.
      #
      # The avian excludes are gone with the vendored copy: avian2d/avian3d and
      # their ecosystem crates come from crates.io now, so they are dependencies
      # rather than members and `--workspace` never reaches them.
      - name: Run tests
        run: |
          cargo test --profile dist --workspace \
            --exclude bevy_firefly \
            --exclude bevy_gauge \
            --exclude bevy_gaussian_splatting \
            --exclude bevy_hanabi \
            --exclude bevy_hui \
            --exclude bevy_mod_outline \
            --exclude bevy_procedural_tree \
            --exclude bevy_silk \
            --exclude vleue_navigator \
            --exclude bevy_mod_openxr \
            --exclude bevy_mod_xr \
            --exclude bevy_xr_utils

  # The standalone C-ABI plugins under `plugins/`, which `--workspace` above can
  # never reach.
  #
  # They are excluded from the workspace on purpose (as members they would
  # inherit the engine's feature unification and link Bevy, destroying the
  # zero-dependency property that lets a plugin build in a second on any
  # machine). The unintended consequence was that ~14k lines — the entire C-ABI
  # boundary, where a mistake is a hard crash inside someone else's game — had
  # never been compiled or tested by CI at all. This job closes that.
  #
  # Each plugin is its own cargo project with its own lockfile, so this is a loop
  # rather than one invocation. They share `plugins/target/` (see
  # `plugins/.cargo/config.toml`), so the common deps compile once for the set.
  #
  # Deliberately does NOT `set -e` per iteration: one broken plugin should report
  # every other plugin's result too, not mask them behind the first failure.
  plugins:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-dist-plugins
          workspaces: plugins -> target

      - name: Test every standalone plugin
        run: |
          failed=""
          for manifest in plugins/*/Cargo.toml; do
            dir=$(dirname "$manifest")
            # Bevy-linked dylibs are retired, not silently skipped as success.
            # Engine extensions are static crates; this lane tests C-ABI guests.
            if grep -q 'crate-type.*"dylib"' "$manifest"; then
              echo "::error::$dir declares a retired Bevy-linked dylib"
              failed="$failed $dir"
              continue
            fi
            echo "::group::$dir"
            if ! (cd "$dir" && cargo test --profile dist); then
              failed="$failed $dir"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::plugins failed:$failed"
            exit 1
          fi
          echo "all plugins built and passed"

      # `tools/updater` is its own workspace for the same reason the plugins are
      # (it must share nothing with the tree it replaces), and so `--workspace`
      # in the `test` job cannot reach it either. Without this it would be the
      # one binary in the repo that nothing ever compiles — and it is the one
      # that runs after the editor has exited, where a failure means a
      # half-replaced install and no process left to repair it.
      # Build only. It is linted in the `clippy` job, which is the one that
      # installs the clippy component — the base image deliberately ships
      # without it so the parallel docker build lanes don't race on the rustup
      # component download.
      - name: Build the update sidecar
        run: cd tools/updater && cargo build --profile dist

  # Tests that need a real graphics adapter — render-graph nodes, pipeline
  # specialization, materials, post-process passes.
  #
  # About a third of this engine cannot execute at all under a `MinimalPlugins`
  # app, and excluding it from the gate means the layer most likely to break on a
  # Bevy bump is the layer nothing checks. lavapipe (Mesa's software Vulkan
  # rasterizer) closes that: it is a real `VkDevice` as far as wgpu is concerned,
  # so `RenderPlugin` initializes normally, the render graph runs, and
  # render-to-texture targets read back — just on the CPU, slowly.
  #
  # Slowly is why this is a separate job rather than folded into `test`: software
  # rasterization is one to two orders of magnitude slower than a GPU, so these
  # tests are opt-in behind `RENZORA_GPU_TESTS` (see `renzora_test_harness`) and
  # a test that finds the variable unset returns early instead of failing. That
  # also means a developer without the variable set never pays for them, and one
  # WITH a real GPU gets the same tests against real hardware.
  #
  # `LIBGL_ALWAYS_SOFTWARE` and `GALLIUM_DRIVER` force the software path even if
  # the runner ever gains a real device — a test that quietly starts exercising
  # different hardware is worse than one that is consistently slow.
  gpu:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm

    env:
      RENZORA_GPU_TESTS: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      # wgpu picks the first adapter it likes; naming the ICD leaves nothing to
      # chance on a runner image that may also carry a stub driver.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci

      # The base image carries the Vulkan *loader* (it is a build dependency of
      # the engine) but no ICD — nothing on a build machine ever needed a driver.
      # lavapipe is the driver.
      - name: Install software Vulkan
        run: |
          apt-get update
          apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-dist-gpu

      # Only the crates that actually have GPU-backed tests. Kept as an explicit
      # list rather than `--workspace`: a software-rasterized `--workspace` run
      # would take hours, and almost all of it would be tests that do not touch
      # an adapter and already ran in the `test` job.
      - name: Run GPU-backed tests
        run: |
          cargo test --profile dist \
            -p renzora_test_harness \
            -p renzora_postprocess \
            -p renzora_shader \
            -p renzora_rmip

  clippy:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci

      # The image deliberately doesn't ship the clippy component (it would make
      # the parallel docker build lanes race on the rustup component download),
      # so add it to the image's toolchain here.
      - name: Install clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-dist

      # Lints the engine's own crates (same first-party scope as `test`).
      # `--no-deps` keeps clippy off the vendored crates that leak in as
      # path-deps. `too_many_arguments` / `type_complexity` are allowed because
      # they're inherent to Bevy systems and queries (Bevy allows them too).
      - name: Clippy
        run: |
          cargo clippy --profile dist --workspace --no-deps \
            --exclude bevy_firefly \
            --exclude bevy_gauge \
            --exclude bevy_gaussian_splatting \
            --exclude bevy_hanabi \
            --exclude bevy_hui \
            --exclude bevy_mod_outline \
            --exclude bevy_procedural_tree \
            --exclude bevy_silk \
            --exclude vleue_navigator \
            --exclude polyanya \
            --exclude bevy_mod_openxr \
            --exclude bevy_mod_xr \
            --exclude bevy_xr_utils \
            -- -D warnings \
            -A clippy::too_many_arguments \
            -A clippy::type_complexity

      # xtask is its own workspace root (see xtask/Cargo.toml), so `--workspace`
      # above does not reach it. Linted separately rather than left uncovered —
      # it owns the plugin-wiring generator.
      - name: Clippy (xtask)
        run: cargo clippy --profile release --manifest-path xtask/Cargo.toml -- -D warnings

      # `tools/updater` is its own workspace too (it must share nothing with the
      # tree it replaces), so `--workspace` above doesn't reach it either. Linted
      # here rather than in the `plugins` job that builds it, because this is the
      # job with the clippy component installed.
      - name: Clippy (update sidecar)
        run: cargo clippy --profile dist --manifest-path tools/updater/Cargo.toml -- -D warnings

  # Each feature variant gets its own runner/cache. Keep stripped-runtime
  # coverage independent of workspace feature unification and disk footprint.
  runtime-features:
    runs-on: ubuntu-latest
    container: rust:1.95.0-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            features: ""
          - name: scripting
            features: scripting
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/native-ci
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-dist-runtime-${{ matrix.name }}
      - name: Check runner disk
        run: df -h .
      - name: Test runtime feature boundary
        run: cargo test --profile dist -p renzora_runtime --no-default-features --features "${{ matrix.features }}" --lib
      - name: Report artifact disk use
        if: always()
        run: du -sh target || true
