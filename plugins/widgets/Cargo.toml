[workspace]

[package]
name = "widgets"
version = "0.1.0"
edition = "2021"
description = "A gallery of every renzora_ember widget the panel vocabulary exposes. Exists to test the panel system, not to do anything."

[lib]
crate-type = ["cdylib"]

[dependencies]
renzora_plugin = { path = "../../crates/renzora_plugin", default-features = false, features = ["libm"] }

[target.'cfg(target_os = "linux")'.dependencies]
# alloc retains unwind helpers for this plugin even with LTO and panic=abort.
# Carry the real runtime instead of importing Rust symbols from the editor.
renzora_plugin = { path = "../../crates/renzora_plugin", default-features = false, features = ["std"] }

[profile.dist]
inherits = "release"
opt-level = 2
strip = "symbols"
# no_std cannot unwind on stable.
panic = "abort"
